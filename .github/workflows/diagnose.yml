name: Diagnose
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Klassenzuordnung
        run: grep -n -B1 -A12 -E "\-> O2\.L:|^[^ ].* -> D\.j0:" app/build/outputs/mapping/release/mapping.txt | head -60
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p de.autoknigge.sudonea -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d -b crash
            adb logcat -d | grep -iE "AndroidRuntime|FATAL|sudonea|Exception" | tail -120
            adb shell pidof de.autoknigge.sudonea || echo "PROZESS LAEUFT NICHT"
